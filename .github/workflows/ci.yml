name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lake build + sorry/axiom audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Mathlib oleans
        uses: actions/cache@v4
        with:
          path: lean/.lake/build
          key: mathlib-olean-${{ hashFiles('lean/lake-manifest.json', 'lean/lean-toolchain') }}
          restore-keys: |
            mathlib-olean-

      - name: Download Mathlib cache
        run: lake exe cache get

      - name: Build library
        run: lake build

      - name: Sorry / admit audit
        working-directory: ${{ github.workspace }}
        run: |
          echo "Checking for code 'sorry' / 'admit' / 'sorryAx' in HessenbergDigraphs sources..."
          if grep -rnE '(^|\s)(sorry|admit)(\s|$)' lean/HessenbergDigraphs.lean lean/HessenbergDigraphs/ | \
             grep -vE '(admits?|admit[a-z]|admitted|admittance)'; then
            echo "FAIL: code 'sorry' or 'admit' found."
            exit 1
          fi
          if grep -rn 'sorryAx' lean/HessenbergDigraphs.lean lean/HessenbergDigraphs/; then
            echo "FAIL: sorryAx found."
            exit 1
          fi
          echo "Sorry audit: clean."

      - name: lake exe hessenberg-audit (axiom + public-API health check)
        run: lake exe hessenberg-audit
